<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Τέταρτος Τοίχος</title>
<meta name="description" content="Τέταρτος Τοίχος — Ανώνυμες θεατρικές σημειώσεις. Ό,τι πέρασε τη γραμμή από τη σκηνή στην πλατεία.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,400;0,600;1,400&family=Sofia+Sans+Condensed:wght@400;500;600&family=Sofia+Sans+Extra+Condensed:wght@700;800&display=swap" rel="stylesheet">
<style>
/* Ιδέα: η σελίδα είναι η πλατεία. Μια κόκκινη οριζόντια γραμμή (ο τέταρτος τοίχος) χωρίζει
   τη σκηνή από την πλατεία στην αρχική και γίνεται γραμμή προόδου ανάγνωσης στα κείμενα.
   Σκοτεινή αίθουσα από προεπιλογή, τα «φώτα πλατείας» ανάβουν το ανοιχτό θέμα. */
:root {
  --bg: #0d0b0b;
  --raise: #171413;
  --text: #e8e1d3;
  --dim: #9a9186;
  --rule: #2c2726;
  --red: #b8281f;
  --red-text: #de5c49;
  --display: 'Sofia Sans Extra Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --ui: 'Sofia Sans Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --body: 'Literata', 'Georgia', 'Times New Roman', serif;
  --read: 20px;
  color-scheme: dark;
}
:root[data-lights="on"] {
  --bg: #ebe5d8;
  --raise: #e0d9c9;
  --text: #181312;
  --dim: #6a6258;
  --rule: #cdc4b2;
  --red: #8f1c15;
  --red-text: #8f1c15;
  color-scheme: light;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--body);
  font-size: 18px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  transition: background-color .5s ease, color .5s ease;
}
a { color: inherit; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--red-text); outline-offset: 3px; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px; }

/* Γραμμή προόδου ανάγνωσης */
#progress {
  position: fixed; top: 0; left: 0; height: 3px; width: 0;
  background: var(--red); z-index: 20;
}

/* Μπάρα */
.bar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px 28px; flex-wrap: wrap;
  padding-top: 22px; padding-bottom: 18px;
  border-bottom: 1px solid var(--rule);
}
.mark {
  font-family: var(--display); font-weight: 800; font-size: 1.7rem;
  letter-spacing: .03em; text-transform: uppercase; text-decoration: none; line-height: 1;
}
.mark b { color: var(--red-text); font-weight: 800; }
.nav { display: flex; align-items: center; gap: 6px 22px; flex-wrap: wrap; }
.nav a, .lights {
  font-family: var(--ui); font-size: 1rem; font-weight: 500;
  letter-spacing: .09em; text-transform: uppercase; text-decoration: none; color: var(--dim);
  padding: 4px 0; border-bottom: 2px solid transparent;
}
.nav a:hover, .lights:hover { color: var(--text); }
.nav a[aria-current="page"] { color: var(--text); border-bottom-color: var(--red); }
.lights {
  background: none; border: 1px solid var(--rule); border-radius: 999px;
  padding: 4px 14px 4px 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
}
.lights i {
  width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid currentColor; display: block;
}
.lights[aria-pressed="true"] i { background: var(--red); border-color: var(--red); }

/* Εναλλαγή προβολής */
#view { min-height: 60vh; outline: none; }
#view.enter { animation: up .45s ease both; }
@keyframes up { from { opacity: .0; } to { opacity: 1; } }

.eyebrow {
  font-family: var(--ui); font-size: .95rem; font-weight: 500; color: var(--dim);
  letter-spacing: .12em; text-transform: uppercase; font-variant-numeric: tabular-nums;
}

/* Αρχική: σκηνή / τοίχος / πλατεία */
.hero { padding: 56px 0 64px; overflow-x: clip; }
.hero h1 {
  font-family: var(--display); font-weight: 800; text-transform: uppercase;
  font-size: clamp(4.6rem, 22vw, 17rem); line-height: .8; letter-spacing: -.005em;
}
.hero h1 span { display: block; }
.hero h1 span:last-child { color: var(--red-text); }
.wall { position: relative; margin: clamp(14px, 2.4vw, 30px) 0; }
.wall::before {
  content: ""; display: block; height: 3px; background: var(--red);
  transform-origin: left center; animation: draw 1.1s cubic-bezier(.2,.7,.1,1) both;
}
@keyframes draw { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.wall em {
  position: absolute; right: 0; font-style: normal;
  font-family: var(--ui); font-size: .85rem; font-weight: 600; letter-spacing: .18em;
  text-transform: uppercase; color: var(--dim); line-height: 1;
}
.wall em.stage { bottom: 12px; }
.wall em.house { top: 12px; }
.thesis {
  display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 20px 56px;
  margin-top: 44px; align-items: end;
}
.thesis p:first-child { font-size: clamp(1.35rem, 2.4vw, 1.9rem); line-height: 1.35; max-width: 24em; text-wrap: balance; }
.thesis p:last-child { color: var(--dim); font-size: 1rem; max-width: 30em; }

.featured {
  border-top: 1px solid var(--rule); padding: 44px 0 52px;
  display: grid; grid-template-columns: 11rem minmax(0, 1fr); gap: 20px 40px;
}
.featured h2 {
  font-size: clamp(2.2rem, 5.2vw, 4rem); font-weight: 400; line-height: 1.08; text-wrap: balance;
  margin: 10px 0 18px;
}
.featured h2 a { text-decoration: none; }
.featured h2 a:hover { color: var(--red-text); }
.featured .excerpt { font-style: italic; font-size: 1.2rem; max-width: 34em; color: var(--text); opacity: .86; }
.more {
  display: inline-block; margin-top: 24px; font-family: var(--ui); font-weight: 600;
  letter-spacing: .12em; text-transform: uppercase; font-size: 1rem; text-decoration: none;
  border-bottom: 2px solid var(--red); padding-bottom: 3px;
}
.more:hover { color: var(--red-text); }

.section-head {
  display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap;
  border-top: 1px solid var(--rule); padding: 22px 0 6px;
}

/* Γραμμές προγράμματος */
.rows { list-style: none; }
.row { border-bottom: 1px solid var(--rule); }
.row a {
  display: grid; grid-template-columns: 3.4rem 8.5rem minmax(0, 1fr) 11rem 3.6rem;
  gap: 6px 20px; align-items: baseline; padding: 22px 0; text-decoration: none;
}
.row .n, .row .d, .row .v, .row .r {
  font-family: var(--ui); font-size: 1rem; letter-spacing: .08em; text-transform: uppercase;
  color: var(--dim); font-variant-numeric: tabular-nums;
}
.row .n { color: var(--red-text); font-weight: 600; }
.row .r { text-align: right; color: var(--text); font-weight: 600; }
.row .t { font-size: 1.55rem; line-height: 1.2; transition: color .2s ease; }
.row .t small { display: block; font-size: 1rem; font-style: italic; color: var(--dim); margin-top: 6px; line-height: 1.5; max-width: 38em; }
.row a:hover .t { color: var(--red-text); }
.row a:hover .t small { color: var(--dim); }

.stats {
  display: flex; gap: 14px 44px; flex-wrap: wrap; padding: 34px 0 10px;
  font-family: var(--ui); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); font-size: .95rem;
}
.stats b { display: block; font-family: var(--display); font-weight: 700; font-size: 2.6rem; color: var(--text); line-height: 1; letter-spacing: 0; font-variant-numeric: tabular-nums; }

/* Αρχείο */
.page-head { padding: 52px 0 30px; }
.page-head h1 {
  font-family: var(--display); font-weight: 800; text-transform: uppercase;
  font-size: clamp(3.4rem, 10vw, 7rem); line-height: .86;
}
.tools { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 22px; }
.tools input, .tools select {
  background: var(--raise); border: 1px solid var(--rule); border-radius: 2px;
  padding: 10px 14px; font-family: var(--ui); font-size: 1.05rem; letter-spacing: .03em;
}
.tools input { flex: 1 1 240px; min-width: 0; }
.tools input::placeholder { color: var(--dim); }
.filters { display: grid; gap: 10px; margin-bottom: 14px; }
.filters div { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.filters span { font-family: var(--ui); font-size: .85rem; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); width: 4.2rem; }
.chip {
  font-family: var(--ui); font-size: .98rem; letter-spacing: .04em;
  background: none; border: 1px solid var(--rule); border-radius: 999px; padding: 3px 14px; cursor: pointer; color: var(--dim);
}
.chip:hover { color: var(--text); border-color: var(--dim); }
.chip[aria-pressed="true"] { background: var(--red); border-color: var(--red); color: #f3ede0; }
.count { padding: 14px 0; border-bottom: 1px solid var(--rule); }
.empty { padding: 48px 0; color: var(--dim); font-style: italic; }
.empty button { background: none; border: none; border-bottom: 1px solid var(--red); cursor: pointer; font-style: normal; color: var(--text); }

/* Κείμενο */
.piece { padding: 40px 0 0; }
.back {
  font-family: var(--ui); font-size: 1rem; font-weight: 500; letter-spacing: .1em; text-transform: uppercase;
  color: var(--dim); text-decoration: none;
}
.back:hover { color: var(--text); }
.piece-head { padding: 34px 0 40px; border-bottom: 1px solid var(--rule); }
.piece-head h1 {
  font-size: clamp(2.5rem, 7vw, 5.2rem); font-weight: 400; line-height: 1.04; text-wrap: balance;
  margin: 14px 0 0; max-width: 14em;
}
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 17rem; gap: 40px 72px; padding-top: 44px; align-items: start; }
.prose { max-width: 34em; font-size: var(--read); line-height: 1.8; }
.prose p { margin-bottom: 1.35em; }
.prose > p:first-child::first-letter {
  font-family: var(--display); font-weight: 800; color: var(--red-text);
  float: left; font-size: 4.9em; line-height: .78; padding: .06em .09em 0 0;
}
.prose blockquote {
  margin: 2em 0 2em -1px; padding: .2em 0 .2em 1.1em; border-left: 3px solid var(--red);
  font-style: italic; font-size: 1.32em; line-height: 1.45; text-wrap: balance;
}
.prose blockquote.cited { font-size: 1.02em; line-height: 1.65; text-wrap: pretty; }
.prose blockquote cite { display: block; margin-top: .9em; font-style: normal; font-family: var(--ui); font-size: .95rem; letter-spacing: .04em; color: var(--dim); }
.prose blockquote cite em { font-style: italic; }
.prose figure { margin: 2.2em 0; }
.prose figure img { display: block; width: 100%; height: auto; }
.prose .slot {
  aspect-ratio: 3 / 2; display: grid; place-items: center; text-align: center; padding: 16px;
  border: 1px dashed var(--dim);
  background: radial-gradient(ellipse 55% 70% at 50% 0%, color-mix(in srgb, var(--text) 16%, transparent), transparent 70%), var(--raise);
  font-family: var(--ui); font-size: .95rem; letter-spacing: .14em; text-transform: uppercase; color: var(--dim);
}
.prose figcaption { font-family: var(--ui); font-size: .95rem; line-height: 1.4; color: var(--dim); margin-top: 10px; letter-spacing: .03em; }
.prose hr { border: none; height: 3px; width: 3.5rem; background: var(--red); margin: 2.6em 0; }

.stub {
  position: sticky; top: 28px; background: var(--raise); border: 1px solid var(--rule);
  font-family: var(--ui); font-size: 1.05rem; line-height: 1.35;
}
.stub h2 { font-size: .85rem; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); padding: 16px 18px 0; }
.stub dl { padding: 12px 18px 16px; display: grid; gap: 12px; }
.stub dt { font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
.stub dd { font-size: 1.15rem; font-weight: 500; }
.stub .tear { border-top: 1px dashed var(--dim); opacity: .6; }
.stub .score { padding: 14px 18px 16px; display: flex; align-items: baseline; justify-content: space-between; }
.stub .score b { font-family: var(--display); font-weight: 800; font-size: 3.4rem; line-height: .9; color: var(--red-text); font-variant-numeric: tabular-nums; }
.stub .score span, .stub .size span { font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
.stub .tags { padding: 14px 18px; display: flex; flex-wrap: wrap; gap: 6px; }
.stub .tags a { border: 1px solid var(--rule); border-radius: 999px; padding: 1px 12px; text-decoration: none; color: var(--dim); font-size: .98rem; }
.stub .tags a:hover { color: var(--text); border-color: var(--dim); }
.stub .size { padding: 12px 18px 16px; display: flex; align-items: center; justify-content: space-between; }
.stub .size div { display: flex; gap: 6px; }
.stub .size button {
  width: 36px; height: 32px; background: none; border: 1px solid var(--rule); cursor: pointer; border-radius: 2px;
  font-family: var(--body);
}
.stub .size button:hover { border-color: var(--dim); }
.stub .size button:disabled { opacity: .35; cursor: default; }

.adjacent { display: grid; grid-template-columns: 1fr 1fr; gap: 0; margin-top: 72px; border-top: 1px solid var(--rule); }
.adjacent a { padding: 26px 0 8px; text-decoration: none; display: block; min-width: 0; }
.adjacent a + a, .adjacent span + a { text-align: right; border-left: 1px solid var(--rule); padding-left: 24px; }
.adjacent a:first-child { padding-right: 24px; }
.adjacent strong { display: block; font-weight: 400; font-size: 1.5rem; line-height: 1.2; margin-top: 4px; }
.adjacent a:hover strong { color: var(--red-text); }

/* Σχετικά */
.about { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 36px 72px; padding-bottom: 20px; }
.entry { border-top: 3px solid var(--red); padding-top: 20px; }
.entry h2 { font-size: 1.9rem; font-weight: 600; line-height: 1.2; }
.entry h2 small { font-weight: 400; font-style: italic; font-size: 1rem; color: var(--dim); margin-left: 8px; }
.entry p { margin-top: 14px; max-width: 32em; }
.plain { border-top: 1px solid var(--rule); padding-top: 20px; }
.plain h2 { font-family: var(--ui); font-size: .95rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
.plain p { margin-top: 14px; max-width: 32em; }

footer {
  margin-top: 96px; border-top: 1px solid var(--rule); padding-top: 22px; padding-bottom: 44px;
  display: flex; justify-content: space-between; gap: 10px 24px; flex-wrap: wrap;
  font-family: var(--ui); font-size: .95rem; letter-spacing: .08em; text-transform: uppercase; color: var(--dim);
}

@media (max-width: 860px) {
  .thesis, .featured, .about { grid-template-columns: minmax(0, 1fr); }
  .cols { grid-template-columns: minmax(0, 1fr); }
  .stub { position: static; }
  .row a { grid-template-columns: 2.6rem minmax(0, 1fr) auto; }
  .row .d { grid-column: 2; grid-row: 1; }
  .row .r { grid-column: 3; grid-row: 1; }
  .row .t { grid-column: 2 / -1; }
  .row .v { grid-column: 2 / -1; }
}
@media (max-width: 480px) {
  .wrap { padding: 0 18px; }
  .adjacent { grid-template-columns: 1fr; }
  .adjacent a + a, .adjacent span + a { text-align: left; border-left: none; padding-left: 0; border-top: 1px solid var(--rule); }
  .adjacent span { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div id="progress" aria-hidden="true"></div>

<header class="wrap bar">
  <a class="mark" href="#" aria-label="Τέταρτος Τοίχος, αρχική">Τεταρτος <b>Τοιχος</b></a>
  <nav class="nav" aria-label="Κύρια πλοήγηση">
    <a href="#" data-nav="home">Αρχική</a>
    <a href="#arxeio" data-nav="arxeio">Αρχείο</a>
    <a href="#sxetika" data-nav="sxetika">Σχετικά</a>
    <button class="lights" id="lights" type="button" aria-pressed="false"><i></i>Φώτα πλατείας</button>
  </nav>
</header>

<main id="view" class="wrap" tabindex="-1"></main>

<footer class="wrap">
  <span>© 2026 Τέταρτος Τοίχος</span>
  <span>Γραμμένο από τη σκοτεινή αίθουσα</span>
</footer>

<script>
/* ============================================================
   ΤΑ ΚΕΙΜΕΝΑ
   Για νέα σημείωση πρόσθεσε ένα αντικείμενο εδώ. Τα υπόλοιπα
   (αρχείο, φίλτρα, χρόνος ανάγνωσης, αρίθμηση) βγαίνουν μόνα τους.
   body: {p:'παράγραφος'} | {q:'παράθεμα'} | {br:true} για διάλειμμα
         | {img:'foto.jpg', caption:'λεζάντα', credit:'φωτογράφος'} για εικόνα
           (με img:null δεν εμφανίζεται τίποτα μέχρι να μπει φωτογραφία).
         | {q:'παράθεμα', by:'πηγή'} για παράθεμα άλλου, με αναφορά.
   date: 'ΕΕΕΕ-ΜΜ-ΗΗ', ή 'ΕΕΕΕ-ΜΜ' αν είναι γνωστός μόνο ο μήνας.
   Μέσα σε παράγραφο, *λέξη* γίνεται πλάγια.
   slug: μόνο λατινικά, αριθμοί και παύλες.
   ============================================================ */
const REVIEWS = [
  {
    slug: 'epistrofi-stin-kolasi',
    title: 'Επιστροφή στην Κόλαση',
    company: 'Ganbatte Theatre Company',
    venue: 'Ρεκτιφιέ',
    date: '2026-05-25',
    rating: null,
    tags: ['υπαρξιακό', 'μακάβριο', 'ganbatte'],
    excerpt: 'Πίσω από τους δαίμονες, τους βρικόλακες και τις σουρεαλιστικές εικόνες, κρύβεται μια παλιά & δυσάρεστη αλήθεια: η κόλαση είναι η ίδια η ανθρώπινη συνθήκη.',
    body: [
      { p: 'Η Επιστροφή στην Κόλαση μοιάζει με υπαρξιακό παραλήρημα μεταμφιεσμένο σε καμένη σχολική χοροεσπερίδα λίγο πριν από την αποκάλυψη. Μύγες μύγες μύγες παντού. Βρισίδι χωρίς φραγμούς. Σώματα που σπαρταρούν μέσα σε αλλόκοτες χορογραφίες. Μουσικές που πότε θυμίζουν τελετουργία παρακμής και πότε μεταμεσονύκτιο panic attack ενός πολιτισμού που έχει πάψει να πιστεύει στον εαυτό του.' },
      { p: 'Κάτω όμως από το χάος, υπάρχει κάτι βαθύτερο. Ένα υπόγειο φιλοσοφικό ρεύμα που διαπερνά την παράσταση σαν δηλητήριο αργής δράσης. Όποιος έχει την τάση να ψάχνει τα δεύτερα και τρίτα επίπεδα θα το νιώσει αμέσως. Οι υπόλοιποι ίσως δουν απλώς μια καμένη performance. Πίσω από τους δαίμονες, τους βρικόλακες και τις σουρεαλιστικές εικόνες, κρύβεται μια παλιά & δυσάρεστη αλήθεια: η κόλαση δεν βρίσκεται κάτω από τη γη. Η κόλαση είναι η ίδια η ανθρώπινη συνθήκη.' },
      { img: null, caption: 'Επιστροφή στην Κόλαση, Ρεκτιφιέ.' },
      { q: 'Ο παράδεισος, αν υπάρξει ποτέ, θα είναι χειροποίητος.' },
      { p: 'Οι χαρακτήρες μοιάζουν σαν έκπτωτοι θεοί που κάνουν διάλειμμα από τη Δευτέρα Παρουσία για να καπνίσουν ένα τελευταίο μπάφο. Ανάμεσα στο γκροτέσκ χιούμορ και στην αποσύνθεση, αναδύεται το πραγματικό θέμα της παράστασης: ο άνθρωπος ως φορέας του Κακού που υποκρίνεται πως το πολεμά. Από παιδιά μαθαίνουμε να εξοστρακίζουμε τον διάβολο κάπου έξω από εμάς. Σε θρησκείες, ιδεολογίες, τέρατα, “άλλους”. Η παράσταση έρχεται να ψιθυρίσει ότι δεν υπάρχει έξοδος κινδύνου από αυτό, γιατί εμείς είμαστε το ίδιο το πρόβλημα.' },

/* ---------- βοηθητικά ---------- */
const MONTHS = ['Ιανουαρίου','Φεβρουαρίου','Μαρτίου','Απριλίου','Μαΐου','Ιουνίου','Ιουλίου','Αυγούστου','Σεπτεμβρίου','Οκτωβρίου','Νοεμβρίου','Δεκεμβρίου'];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const MONTHS_NOM = ['Ιανουάριος','Φεβρουάριος','Μάρτιος','Απρίλιος','Μάιος','Ιούνιος','Ιούλιος','Αύγουστος','Σεπτέμβριος','Οκτώβριος','Νοέμβριος','Δεκέμβριος'];
const fmtDate = iso => { const [, m, d] = iso.split('-').map(Number); return d ? d + ' ' + MONTHS[m - 1] : MONTHS_NOM[m - 1]; };
const rich = s => esc(s).replace(/\*([^*]+)\*/g, '<em>$1</em>');
const words = r => r.body.map(b => b.p || (b.by ? b.q : '') || '').join(' ').split(/\s+/).filter(Boolean).length;
const minutes = r => Math.max(1, Math.round(words(r) / 200));
const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/ς/g, 'σ');
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};

const byNew = [...REVIEWS].sort((a, b) => b.date.localeCompare(a.date));
const byOld = [...byNew].reverse();
byOld.forEach((r, i) => { r.no = String(i + 1).padStart(2, '0'); });
const allTags = [...new Set(REVIEWS.flatMap(r => r.tags))];
const allVenues = [...new Set(REVIEWS.map(r => r.venue))];

const view = document.getElementById('view');
const progress = document.getElementById('progress');
const filter = { q: '', tag: null, venue: null, sort: 'new' };

function rowHTML(r) {
  return `<li class="row"><a href="#${r.slug}">
    <span class="n">№ ${r.no}</span>
    <span class="d">${fmtDate(r.date)}</span>
    <span class="t">${esc(r.title)}<small>${esc(r.excerpt)}</small></span>
    <span class="v">${esc(r.venue)}</span>
    <span class="r">${r.rating != null ? r.rating + '/10' : ''}</span>
  </a></li>`;
}

/* ---------- αρχείο ---------- */
function renderArchive() {
  const chips = (list, key) => list.map(v =>
    `<button type="button" class="chip" data-key="${key}" data-val="${esc(v)}" aria-pressed="${filter[key] === v}">${key === 'tag' ? '#' : ''}${esc(v)}</button>`).join('');
  view.innerHTML = `
    <div class="page-head"><h1>Αρχείο</h1></div>
    <div class="tools">
      <input id="q" type="search" placeholder="Ψάξε παράσταση, θέατρο ή λέξη-κλειδί…" aria-label="Αναζήτηση" value="${esc(filter.q)}">
      <select id="sort" aria-label="Ταξινόμηση">
        <option value="new">Νεότερες πρώτα</option>
        <option value="old">Παλαιότερες πρώτα</option>
        <option value="rating">Κατά βαθμολογία</option>
      </select>
    </div>
    <div class="filters">
      <div><span>Θέμα</span>${chips(allTags, 'tag')}</div>
      <div><span>Χώρος</span>${chips(allVenues, 'venue')}</div>
    </div>
    <p class="eyebrow count" id="count" aria-live="polite"></p>
    <div id="list"></div>`;
  const q = document.getElementById('q'), sort = document.getElementById('sort');
  sort.value = filter.sort;
  q.addEventListener('input', () => { filter.q = q.value; updateList(); });
  sort.addEventListener('change', () => { filter.sort = sort.value; updateList(); });
  view.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
    const k = c.dataset.key, v = c.dataset.val;
    filter[k] = filter[k] === v ? null : v;
    view.querySelectorAll(`.chip[data-key="${k}"]`).forEach(o => o.setAttribute('aria-pressed', filter[k] === o.dataset.val));
    updateList();
  }));
  updateList();
}

function updateList() {
  const needle = norm(filter.q.trim());
  let list = byNew.filter(r =>
    (!filter.tag || r.tags.includes(filter.tag)) &&
    (!filter.venue || r.venue === filter.venue) &&
    (!needle || norm([r.title, r.venue, r.company || '', r.tags.join(' '), r.excerpt, r.body.map(b => b.p || b.q || '').join(' ')].join(' ')).includes(needle)));
  if (filter.sort === 'old') list.reverse();
  if (filter.sort === 'rating') list.sort((a, b) => (b.rating ?? -1) - (a.rating ?? -1));
  document.getElementById('count').textContent = list.length === 1 ? '1 σημείωση' : list.length + ' σημειώσεις';
  const box = document.getElementById('list');
  if (list.length) { box.innerHTML = `<ul class="rows">${list.map(rowHTML).join('')}</ul>`; return; }
  box.innerHTML = `<p class="empty">Σκοτάδι. Καμία σημείωση δεν ταιριάζει με αυτά τα φίλτρα. <button type="button" id="clear">Καθάρισε τα φίλτρα</button></p>`;
  document.getElementById('clear').addEventListener('click', () => {
    Object.assign(filter, { q: '', tag: null, venue: null });
    renderArchive();
  });
}

/* ---------- κείμενο ---------- */
const SIZES = [18, 20, 22, 24];
let sizeIdx = Math.min(SIZES.length - 1, Math.max(0, parseInt(store.get('tt-size') ?? '1', 10) || 0));
function applySize() {
  document.documentElement.style.setProperty('--read', SIZES[sizeIdx] + 'px');
  const m = document.getElementById('minus'), p = document.getElementById('plus');
  if (m) m.disabled = sizeIdx === 0;
  if (p) p.disabled = sizeIdx === SIZES.length - 1;
}

function renderPiece(r) {
  const i = byOld.indexOf(r), prev = byOld[i - 1], next = byOld[i + 1];
  const fig = b => !b.img ? '' : `<figure>${b.img
      ? `<img src="${esc(b.img)}" alt="${esc(b.alt || b.caption || r.title)}">`
      : ''}${b.caption || b.credit
      ? `<figcaption>${esc(b.caption || '')}${b.credit ? ' Φωτογραφία: ' + esc(b.credit) : ''}</figcaption>` : ''}</figure>`;
  const body = r.body.map(b => b.p ? `<p>${rich(b.p)}</p>` : b.q ? (b.by ? `<blockquote class="cited">${rich(b.q)}<cite>${rich(b.by)}</cite></blockquote>` : `<blockquote>«${rich(b.q)}»</blockquote>`) : 'img' in b ? fig(b) : '<hr>').join('');
  view.innerHTML = `
    <article class="piece">
      <a class="back" href="#arxeio">← Αρχείο</a>
      <header class="piece-head">
        <p class="eyebrow">№ ${r.no} · ${esc(r.venue)} · ${fmtDate(r.date)} · ${minutes(r)}′ ανάγνωσης</p>
        <h1>${esc(r.title)}</h1>
      </header>
      <div class="cols">
        <div class="prose" id="prose">${body}</div>
        <aside class="stub" aria-label="Ταυτότητα παράστασης">
          <h2>Ταυτότητα παράστασης</h2>
          <dl>
            <div><dt>Παράσταση</dt><dd>${esc(r.title)}</dd></div>
            ${r.company ? `<div><dt>Ομάδα</dt><dd>${esc(r.company)}</dd></div>` : ''}
            <div><dt>Χώρος</dt><dd>${esc(r.venue)}</dd></div>
            <div><dt>Ημερομηνία</dt><dd>${fmtDate(r.date)}</dd></div>
          </dl>
          ${r.rating != null ? `<div class="tear"></div><div class="score"><span>Βαθμολογία</span><b>${r.rating}/10</b></div>` : ''}
          <div class="tear"></div>
          <div class="tags">${r.tags.map(t => `<a href="#arxeio" data-tag="${esc(t)}">#${esc(t)}</a>`).join('')}</div>
          <div class="tear"></div>
          <div class="size"><span>Μέγεθος γραμμάτων</span>
            <div><button type="button" id="minus" aria-label="Μικρότερα γράμματα">Α−</button><button type="button" id="plus" aria-label="Μεγαλύτερα γράμματα">Α+</button></div>
          </div>
        </aside>
      </div>
      <nav class="adjacent" aria-label="Γειτονικές σημειώσεις">
        ${prev ? `<a href="#${prev.slug}"><span class="eyebrow">← Προηγούμενη</span><strong>${esc(prev.title)}</strong></a>` : '<span></span>'}
        ${next ? `<a href="#${next.slug}"><span class="eyebrow">Επόμενη →</span><strong>${esc(next.title)}</strong></a>` : ''}
      </nav>
    </article>`;
  view.querySelectorAll('[data-tag]').forEach(a => a.addEventListener('click', () => {
    Object.assign(filter, { q: '', venue: null, tag: a.dataset.tag });
  }));
  document.getElementById('minus').addEventListener('click', () => { sizeIdx--; store.set('tt-size', sizeIdx); applySize(); });
  document.getElementById('plus').addEventListener('click', () => { sizeIdx++; store.set('tt-size', sizeIdx); applySize(); });
  applySize();
}

/* ---------- σχετικά ---------- */
function renderAbout() {
  view.innerHTML = `
    <div class="page-head"><h1>Σχετικά</h1></div>
    <div class="about">
      <section class="entry">
        <h2>τέταρτος τοίχος <small>(ο), θεατρικός όρος</small></h2>
        <p>Ο νοητός τοίχος που χωρίζει τη σκηνή από την πλατεία. Οι ηθοποιοί παίζουν σαν να μην υπάρχει κοινό και το κοινό κοιτάζει σαν να μην το βλέπει κανείς.</p>
        <p>Η ιδέα αποδίδεται στον Ντιντερό, τον 18ο αιώνα. Ο Μπρεχτ έκανε το γκρέμισμά του μέθοδο.</p>
      </section>
      <section class="plain">
        <h2>Από την πλατεία</h2>
        <p>Αυτό δεν είναι δημοσιογραφικός οδηγός ούτε δελτίο τύπου. Είναι οι σημειώσεις κάποιου που βλέπει πολύ θέατρο και κρατάει όσα δεν σβήνουν μαζί με το τελευταίο φως της σκηνής.</p>
        <p>Όσα διαβάζεις εδώ είναι εντελώς προσωπικά, συχνά άδικα, πάντα ειλικρινή. Η υπογραφή δεν έχει σημασία — γι’ αυτό και δεν υπάρχει.</p>
      </section>
    </div>`;
}

/* ---------- δρομολόγηση ---------- */
let current = null;
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  const r = REVIEWS.find(x => x.slug === h);
  const name = r ? 'piece' : (h === 'arxeio' || h === 'sxetika') ? h : 'home';
  if (r) renderPiece(r); else if (name === 'arxeio') renderArchive(); else if (name === 'sxetika') renderAbout(); else renderHome();
  document.querySelectorAll('[data-nav]').forEach(a => {
    const on = a.dataset.nav === name || (name === 'piece' && a.dataset.nav === 'arxeio');
    if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  document.title = r ? r.title + ' · Τέταρτος Τοίχος' : 'Τέταρτος Τοίχος';
  if (current !== null) {
    window.scrollTo(0, 0);
    view.classList.remove('enter'); void view.offsetWidth; view.classList.add('enter');
  }
  current = name;
  onScroll();
}

function onScroll() {
  const prose = document.getElementById('prose');
  if (!prose) { progress.style.width = '0'; return; }
  const rect = prose.getBoundingClientRect();
  const total = rect.height - window.innerHeight * 0.6;
  const done = Math.min(1, Math.max(0, (-rect.top + window.innerHeight * 0.4) / Math.max(1, total)));
  progress.style.width = (done * 100) + '%';
}

/* ---------- φώτα πλατείας ---------- */
const lights = document.getElementById('lights');
function setLights(on) {
  if (on) document.documentElement.setAttribute('data-lights', 'on');
  else document.documentElement.removeAttribute('data-lights');
  lights.setAttribute('aria-pressed', on);
}
setLights(store.get('tt-lights') === 'on');
lights.addEventListener('click', () => {
  const on = lights.getAttribute('aria-pressed') !== 'true';
  setLights(on); store.set('tt-lights', on ? 'on' : 'off');
});

document.addEventListener('keydown', e => {
  if (e.key === '/' && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) {
    const q = document.getElementById('q');
    if (q) { e.preventDefault(); q.focus(); }
  }
});
window.addEventListener('scroll', onScroll, { passive: true });
window.addEventListener('resize', onScroll);
window.addEventListener('hashchange', route);
route();
</script>
